<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Device check</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 3rem auto; padding: 0 1rem; color: #1e293b; }
    h1 { font-size: 1.4rem; }
    fieldset { border: 1px solid #e2e8f0; border-radius: 8px; margin: 1rem 0; padding: 1rem; }
    label { display: block; margin: 0.4rem 0; }
    button { font-size: 1rem; padding: 0.5rem 1.5rem; background: #4f46e5; color: #fff; border: 0; border-radius: 6px; }
    textarea { width: 100%; min-height: 4rem; }
  </style>
</head>
<body>
  <h1>Do you still have {{ device }}?</h1>
  <p>One question from the technology office — takes ten seconds.</p>
  <form method="post" action="/attest/{{ token }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <fieldset>
      <legend>Do you have it?</legend>
      <label><input type="radio" name="have" value="yes" required> Yes, I have it</label>
      <label><input type="radio" name="have" value="no"> No, I do not have it</label>
    </fieldset>
    <fieldset>
      <legend>What shape is it in?</legend>
      <label><input type="radio" name="condition" value="good" required> Good — works fine</label>
      <label><input type="radio" name="condition" value="fair"> Fair — some wear</label>
      <label><input type="radio" name="condition" value="poor"> Poor — damaged but usable</label>
      <label><input type="radio" name="condition" value="broken"> Broken — does not work</label>
    </fieldset>
    <label for="note">Anything we should know? (optional)</label>
    <textarea id="note" name="note" maxlength="500" placeholder="e.g. the charger is missing"></textarea>
    <p><button type="submit">Send answer</button></p>
  </form>
</body>
</html>
