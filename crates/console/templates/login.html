<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Chalk Console</title>
    <link rel="stylesheet" href="{{ crate::assets::tokens_css_href() }}">
    <link rel="stylesheet" href="{{ crate::assets::base_css_href() }}">
    <link rel="stylesheet" href="{{ crate::assets::components_css_href() }}">
    <link rel="stylesheet" href="{{ crate::assets::console_css_href() }}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <h1 class="auth-brand">Chalk</h1>
        <p class="auth-subtitle">Admin Console</p>
        {% if let Some(err) = error %}
        <p class="auth-alert">{{ err }}</p>
        {% endif %}
        <form class="auth-form" method="post" action="/login">
            <label for="password">Admin Password</label>
            <input type="password" id="password" name="password" placeholder="Enter admin password" required autofocus>
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
