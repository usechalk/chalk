<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Chalk Console</title>
    <link rel="stylesheet" href="{{ crate::assets::tokens_css_href() }}">
    <link rel="stylesheet" href="{{ crate::assets::base_css_href() }}">
    <link rel="stylesheet" href="{{ crate::assets::components_css_href() }}">
    <link rel="stylesheet" href="{{ crate::assets::console_css_href() }}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <h1 class="auth-brand">Chalk</h1>
        <p class="auth-subtitle auth-subtitle--tight">Admin Console</p>
        {% if let Some(n) = notice %}
        <p class="auth-notice">{{ n }}</p>
        {% else %}
        {% if let Some(err) = error %}
        <p class="auth-alert">{{ err }}</p>
        {% endif %}
        <p class="auth-help">Enter your admin email and we'll send you a one-time sign-in link.</p>
        <form class="auth-form" method="post" action="/login">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@school.org" required autofocus>
            <button type="submit">Email me a sign-in link</button>
        </form>
        {% endif %}
    </div>
</body>
</html>
