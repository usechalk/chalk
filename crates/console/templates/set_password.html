<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set Password - Chalk Console</title>
    <link rel="stylesheet" href="{{ crate::assets::tokens_css_href() }}">
    <link rel="stylesheet" href="{{ crate::assets::base_css_href() }}">
    <link rel="stylesheet" href="{{ crate::assets::components_css_href() }}">
    <link rel="stylesheet" href="{{ crate::assets::console_css_href() }}">
</head>
<body class="auth-body">
    <div class="auth-card auth-card--wide">
        <h1 class="auth-brand">Chalk</h1>
        <p class="auth-subtitle">Set Your Password</p>
        {% if let Some(err) = error %}
        <p class="auth-alert">{{ err }}</p>
        {% endif %}
        <form class="auth-form auth-form--tight" method="post" action="/set-password">
            <input type="hidden" name="reset_token" value="{{ reset_token }}">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" placeholder="At least 12 characters" required autofocus minlength="12">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" placeholder="Re-enter password" required minlength="12">
            <button type="submit">Set Password</button>
        </form>
    </div>
</body>
</html>
