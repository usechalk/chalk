name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish the container image from (for example, v1.46.0).
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86_64:
    name: Build linux-x86_64
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No toolchain version named here on purpose: rust-toolchain.toml is
      # the single source of truth and rustup honours it. Naming `stable`
      # here installed the target for stable while cargo then switched to
      # the pinned toolchain, which did not have it — the cross-compile
      # failed with "can't find crate for `core`" while the three native
      # builds passed. `rustup target add` acts on the active toolchain.
      - name: Install pinned Rust toolchain and target
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-cargo-

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: chalk-x86_64-unknown-linux-gnu
          path: target/x86_64-unknown-linux-gnu/release/chalk

  build-macos-x86_64:
    name: Build macos-x86_64
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # No toolchain version named here on purpose: rust-toolchain.toml is
      # the single source of truth and rustup honours it. Naming `stable`
      # here installed the target for stable while cargo then switched to
      # the pinned toolchain, which did not have it — the cross-compile
      # failed with "can't find crate for `core`" while the three native
      # builds passed. `rustup target add` acts on the active toolchain.
      - name: Install pinned Rust toolchain and target
        run: rustup target add x86_64-apple-darwin

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-cargo-

      - name: Build release binary
        run: cargo build --release --target x86_64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: chalk-x86_64-apple-darwin
          path: target/x86_64-apple-darwin/release/chalk

  build-macos-aarch64:
    name: Build macos-aarch64
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # No toolchain version named here on purpose: rust-toolchain.toml is
      # the single source of truth and rustup honours it. Naming `stable`
      # here installed the target for stable while cargo then switched to
      # the pinned toolchain, which did not have it — the cross-compile
      # failed with "can't find crate for `core`" while the three native
      # builds passed. `rustup target add` acts on the active toolchain.
      - name: Install pinned Rust toolchain and target
        run: rustup target add aarch64-apple-darwin

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-aarch64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-cargo-

      - name: Build release binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: chalk-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/chalk

  build-windows-x86_64:
    name: Build windows-x86_64
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # No toolchain version named here on purpose: rust-toolchain.toml is
      # the single source of truth and rustup honours it. Naming `stable`
      # here installed the target for stable while cargo then switched to
      # the pinned toolchain, which did not have it — the cross-compile
      # failed with "can't find crate for `core`" while the three native
      # builds passed. `rustup target add` acts on the active toolchain.
      - name: Install pinned Rust toolchain and target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-cargo-

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: chalk-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release/chalk.exe

  publish-container:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            release_tag="${{ inputs.release_tag }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          case "$release_tag" in
            v*)
              version="${release_tag#v}"
              ;;
            *)
              echo "release_tag must start with v: $release_tag" >&2
              exit 1
              ;;
          esac

          {
            echo "release_tag=$release_tag"
            echo "version=$version"
            echo "tags<<EOF"
            echo "ghcr.io/usechalk/chalk:$version"
            echo "ghcr.io/usechalk/chalk:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.release_tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/usechalk/chalk
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

  release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs:
      - build-linux-x86_64
      - build-macos-x86_64
      - build-macos-aarch64
      - build-windows-x86_64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download linux-x86_64 artifact
        uses: actions/download-artifact@v8
        with:
          name: chalk-x86_64-unknown-linux-gnu
          path: artifacts/linux-x86_64

      - name: Download macos-x86_64 artifact
        uses: actions/download-artifact@v8
        with:
          name: chalk-x86_64-apple-darwin
          path: artifacts/macos-x86_64

      - name: Download macos-aarch64 artifact
        uses: actions/download-artifact@v8
        with:
          name: chalk-aarch64-apple-darwin
          path: artifacts/macos-aarch64

      - name: Download windows-x86_64 artifact
        uses: actions/download-artifact@v8
        with:
          name: chalk-x86_64-pc-windows-msvc
          path: artifacts/windows-x86_64

      - name: Rename binaries
        run: |
          mv artifacts/linux-x86_64/chalk artifacts/chalk-x86_64-unknown-linux-gnu
          mv artifacts/macos-x86_64/chalk artifacts/chalk-x86_64-apple-darwin
          mv artifacts/macos-aarch64/chalk artifacts/chalk-aarch64-apple-darwin
          mv artifacts/windows-x86_64/chalk.exe artifacts/chalk-x86_64-pc-windows-msvc.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/chalk-x86_64-unknown-linux-gnu
            artifacts/chalk-x86_64-apple-darwin
            artifacts/chalk-aarch64-apple-darwin
            artifacts/chalk-x86_64-pc-windows-msvc.exe
