name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # GitHub deprecated Node 20 runners for JS actions; force the new
  # Node 24 runtime even on action versions that still default to 20.
  # Drop this once every action below has bumped to a Node-24 default
  # release.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: Check, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      # ubuntu-latest ships with ~14 GB free; Wave B grew our cache (target
      # debug+release across 10 crates, several large transitive deps) past
      # what fits during restore, surfacing as "No space left on device"
      # while the cache action wrote its diagnostics. Drop the preinstalled
      # Android/.NET/Haskell stuff we don't use to claw back ~25 GB.
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v7

      # No toolchain version here on purpose. rust-toolchain.toml is the single
      # source of truth and rustup (preinstalled on the runner) honors it, so
      # CI and every developer machine run byte-identical clippy and rustfmt.
      # Naming `stable` here instead is what let CI drift ahead of local and
      # fail on lints that did not exist locally.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      # Cache the cargo registry/git only — `target/` had grown to multiple
      # GB and restoring it ate the disk we just freed. Cold target builds
      # cost ~1-2 minutes with the registry warm, which is the right
      # trade-off.
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # Fails if a retired product claim reappears on a published surface.
      # Runs before the Rust steps because it takes ~1s and a messaging
      # regression should not wait behind a 10-minute build to be reported.
      # See plans/PRD.md §3 (D3/D4/D5) for what each rule enforces.
      - name: Messaging lint
        run: ./scripts/messaging-lint.sh

      # Fails if a colour pair the product paints drops below its WCAG 2.1 AA
      # threshold. D10 makes AA a build constraint, and a contrast regression
      # is a one-character token edit that no reviewer catches by eye. Same
      # placement rationale as the messaging lint: ~1s, so report it first.
      - name: Contrast registry
        run: python3 scripts/contrast.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all

      # The `#[ignore]`d suites, which are the ones that exercise Postgres.
      # `cargo test --all` skips them, so until now the only database CI ever
      # validated was SQLite — while every hosted tenant runs on Postgres.
      # Schema parity, migration serialisation and tenant isolation were
      # therefore checked only when somebody remembered to run them locally
      # with Docker up.
      #
      # They use testcontainers, which needs no service block: the runner
      # already has Docker.
      # `--lib --tests` excludes doctests deliberately. `--ignored` conflates
      # two unrelated meanings of the word: `#[ignore]` on a test means "skip
      # unless asked", while ```ignore on a doc example means "this is
      # illustrative, do not compile it". Without the filter this step forces
      # the illustrative examples to compile and they fail, which looks like a
      # broken test suite and is really a broken command.
      - name: Run Postgres-backed tests
        run: cargo test --all --lib --tests -- --ignored

      - name: Build release
        run: cargo build --release
