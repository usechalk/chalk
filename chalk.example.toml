# Chalk Configuration
# Copy this file to chalk.toml and update with your settings.

[chalk]
instance_name = "My School District"
data_dir = "/var/lib/chalk"
# public_url = "https://chalk.example.com"

[chalk.database]
driver = "sqlite"
path = "/var/lib/chalk/chalk.db"

# To use PostgreSQL instead of SQLite, set driver = "postgres", provide a
# connection URL, and choose a schema name. The schema must match
# ^[a-z][a-z0-9_]{2,40}$ (lowercase, starts with a letter, length 3..=41).
# Migrations run into that schema and `search_path` is scoped to it for the pool.
# Example:
#
# [chalk.database]
# driver = "postgres"
# url = "postgres://chalk:chalk@localhost:5432/chalk"
# schema = "chalk"

[chalk.telemetry]
enabled = false

[sis]
enabled = true
provider = "PowerSchool"        # PowerSchool | InfiniteCampus | Skyward
base_url = "https://your-sis.example.com"
# token_url = ""                # Required for Infinite Campus and Skyward
client_id = "your-client-id"
client_secret = "your-client-secret"
sync_schedule = "0 2 * * *"     # Daily at 2:00 AM

# Identity Provider — SAML SSO, QR badges, picture passwords
[idp]
enabled = false
# qr_badge_login = true
# picture_passwords = true
# saml_cert_path = "/var/lib/chalk/saml_cert.pem"
# saml_key_path = "/var/lib/chalk/saml_key.pem"
# session_timeout_minutes = 480
# default_password_pattern = "{lastName}{birthYear}"
# default_password_roles = ["student"]

# [idp.google]
# entity_id = ""
# acs_url = ""
# workspace_domain = ""

# Google Workspace Sync — user provisioning and OU management
[google_sync]
enabled = false
# provision_users = true
# manage_ous = true
# suspend_inactive = false
# sync_schedule = "0 3 * * *"
# service_account_key_path = "/var/lib/chalk/google-sa.json"
# admin_email = "admin@yourdomain.com"
# workspace_domain = "yourdomain.com"

# [google_sync.ou_mapping]
# students = "/Students/{school}/{grade}"
# teachers = "/Teachers/{school}"
# staff = "/Staff/{school}"

# ChromeOS Device Sync — read-only fleet inventory from Google Workspace.
# Credentials fall back to [google_sync] when omitted here.
# Product modules. Self-host is never gated: every module defaults to on, and
# turning one off here only tidies your nav. These exist for hosted, where the
# control plane writes them per tenant from that tenant's plan.
#
# A disabled module 404s rather than merely losing its sidebar link.
[modules]
# devices = true
# helpdesk = true
# roster_sso = true
# Asset types this deployment may create. Empty means unrestricted, which is
# the self-host default. Hosted free tier sets ["chromebook"].
# asset_types_allowed = []

[device_sync]
enabled = false
# Write-back is a separate, deliberate opt-in. Reading a district's fleet and
# changing it are different levels of trust, and turning this on changes the
# scopes Chalk requests -- the domain-wide delegation grant in the Admin console
# has to be updated to match, or every call returns a 403 that looks nothing
# like a scope problem.
# write_back_enabled = false
# customer_id = "my_customer"     # resolves to the impersonated admin's domain
# page_size = 200                 # devices per API page; Google's maximum is 300
# sync_schedule = "0 4 * * *"
# requests_per_minute = 500       # client-side ceiling, well under Google's quota
# service_account_key_path = "/var/lib/chalk/google-sa.json"
# admin_email = "admin@yourdomain.com"
# workspace_domain = "yourdomain.com"
# org_unit_filter = "/Students"   # ingest only this subtree (filtered locally)

# Active Directory Sync — LDAP user provisioning from SIS data
[ad_sync]
enabled = false
# sync_schedule = "0 2 * * *"

# [ad_sync.connection]
# server = "ldaps://dc01.example.com:636"
# bind_dn = "CN=Chalk Service,OU=Service Accounts,DC=example,DC=com"
# bind_password = "your-bind-password"
# base_dn = "DC=example,DC=com"
# tls_verify = true
# tls_ca_cert = "/var/lib/chalk/ad-ca.crt"

# [ad_sync.ou_mapping]
# students = "Students/{school}/{grade}"
# teachers = "Teachers/{school}"
# staff = "Staff/{school}"

# [ad_sync.passwords]
# pattern = "{first:1}{Last:1}{sis_id}!"
# min_length = 12

# [ad_sync.options]
# provision_users = true
# deprovision_action = "disable"   # disable | move_to_ou | delete
# deprovision_ou = "OU=Disabled,DC=example,DC=com"
# manage_ous = true
# manage_groups = false

